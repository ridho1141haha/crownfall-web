name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint, test & build (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Automated gameplay tests (bun test)
        run: bun test tests/game/

      - name: Production build
        # next build needs the Prisma client generated (postinstall does this
        # during bun install). No secrets or external services required.
        run: bun run build
